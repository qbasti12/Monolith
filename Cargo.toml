[workspace]
resolver = "2"
members = [
    "monolith-core",
    "monolith-engine",
    "monolith-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ratatui = { version = "0.30.2", features = ["crossterm_0_29"] }
crossterm = "0.29.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
